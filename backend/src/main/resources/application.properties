spring.application.name=frezco

# ---- Base de datos ----
# Instancia de SQL Server compartida con el Sistema de Gestion de Obras, base propia.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:frezco};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Servidor ----
server.port=${BACKEND_PORT:8090}
server.servlet.session.cookie.name=FREZCOSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h

# ---- Credenciales de la aplicacion (usuario unico, sin tabla de usuarios) ----
app.seguridad.usuario=${APP_USER:admin}
app.seguridad.clave=${APP_PASSWORD:admin}
# Origenes permitidos para el frontend en desarrollo. En prod el frontend va detras del
# mismo nginx, asi que no hace falta CORS.
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:4300}

# ---- Serializacion ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always
