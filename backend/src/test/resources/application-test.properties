# Base en memoria solo para validar el mapeo y las consultas. El esquema real lo crea Flyway
# sobre SQL Server; aca se genera desde las entidades.
spring.datasource.url=jdbc:h2:mem:frezco;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
