<div class="kpi-fade-in rounded-xl shadow-md p-4 h-full flex flex-col justify-between"
     [style.backgroundColor]="tintado ? colores.fondo : '#ffffff'"
     [style.borderLeftColor]="colores.borde"
     [style.borderLeftWidth.px]="6">
  <div class="flex items-center gap-2 mb-1">
    @if (icono) {
      <i class="pi {{ icono }}" [style.color]="colores.texto"></i>
    }
    <span class="text-sm font-poppins font-semibold text-gray-600">{{ titulo }}</span>
  </div>
  <p class="text-2xl font-poppins font-bold" [style.color]="colores.texto">{{ valor }}</p>
  @if (descripcion) {
    <p class="text-xs text-gray-500 mt-1">{{ descripcion }}</p>
  }
</div>
