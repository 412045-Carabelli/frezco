<div class="relative flex justify-between items-center w-full p-6 md:p-8 shadow-lg text-white overflow-hidden no-imprimir"
     [style.background]="estilo.fondo">
  <div class="absolute inset-0 opacity-10 pointer-events-none">
    <div class="absolute -right-8 -top-8 w-32 h-32 bg-white rounded-full"></div>
    <div class="absolute -left-8 -bottom-8 w-24 h-24 bg-white rounded-full"></div>
  </div>
  <div class="relative z-10">
    <h1 class="font-poppins font-bold text-2xl md:text-3xl">{{ titulo }}</h1>
    @if (subtitulo) {
      <p class="text-sm mt-1" [ngClass]="estilo.subtitulo">{{ subtitulo }}</p>
    }
    <ng-content select="[membrete-meta]" />
  </div>
  <div class="relative z-10 flex items-center gap-2">
    <ng-content select="[membrete-acciones]" />
    @if (mostrarVolver) {
      <p-button label="Volver" icon="pi pi-arrow-left" severity="success"
                (onClick)="volver()" ariaLabel="Volver" />
    }
  </div>
</div>
