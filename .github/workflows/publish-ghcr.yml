name: Publicar imagenes en GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [ backend, frontend ]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar owner a minusculas
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolver tag de version
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push de ${{ matrix.servicio }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.servicio }}
          push: true
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/frezco-${{ matrix.servicio }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.tag != 'latest' && format('{0}/{1}/frezco-{2}:latest', env.REGISTRY, steps.owner.outputs.owner, matrix.servicio) || '' }}
